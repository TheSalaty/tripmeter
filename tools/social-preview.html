<style>
*{box-sizing:border-box;margin:0}
html,body{width:1280px;height:640px;overflow:hidden}
body{font-family:"Adwaita Sans",Cantarell,sans-serif;color:#f2f2f5;background:#141418;position:relative}
.glow{position:absolute;inset:0;background:
 radial-gradient(520px 420px at 1180px 60px,rgba(145,65,172,.38),transparent 70%),
 radial-gradient(560px 460px at 700px 640px,rgba(53,132,228,.34),transparent 70%),
 radial-gradient(420px 360px at 1000px 380px,rgba(46,194,126,.20),transparent 70%),
 radial-gradient(500px 400px at 0 0,rgba(53,132,228,.14),transparent 70%)}
.text{position:absolute;left:64px;top:0;bottom:0;width:400px;display:flex;flex-direction:column;justify-content:center}
.kicker{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:600;color:#b9b9c4;letter-spacing:.02em;margin-bottom:22px}
.chip{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff}
.chip svg{width:20px;height:20px}
h1{font-size:76px;line-height:1;font-weight:800;letter-spacing:-.035em;margin-bottom:20px}
.tag{font-size:29px;line-height:1.22;font-weight:600;letter-spacing:-.015em;margin-bottom:26px}
ul{list-style:none;padding:0;font-size:19px;line-height:1.3;color:#c9c9d2;display:grid;gap:10px;margin-bottom:30px}
li{display:flex;gap:12px;align-items:baseline}
li i{flex:none;width:9px;height:9px;border-radius:50%;transform:translateY(-1px)}
li b{color:#fff;font-weight:700}
.foot{font-size:16px;color:#9a9aa6;font-weight:500}
.shot{position:absolute;width:368px;background-repeat:no-repeat;border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.07);display:block}
.pill{position:absolute;left:508px;top:44px;width:368px;height:52px;border-radius:26px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.07)}
.pill img{position:absolute;left:-16px;top:-4px}
</style>
